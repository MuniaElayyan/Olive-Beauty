<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - Olive Beauty</title>
<link rel="icon" type="image/png" href="d.png">
<script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-[#17231B] text-[#F5F0E6] min-h-screen flex items-center justify-center">


<div class="bg-[#1F3024] p-10 rounded-2xl shadow-2xl w-96">
<img 
src="d.png"
class="w-28 h-28 mx-auto rounded-full border-4 border-[#B8A06A] shadow-xl mb-5">

<h1 class="text-3xl text-center font-bold text-[#E8DCC4] mb-8">

Olive Beauty

</h1>


<h2 class="text-xl text-center text-[#B6AD90] mb-6">

Login

</h2>



<input 
id="username"
type="text"
placeholder="Username"
class="w-full mb-4 p-3 rounded-lg bg-[#243428] border border-[#B8A06A] text-white outline-none">


<input 
id="password"
type="password"
placeholder="Password"
class="w-full mb-6 p-3 rounded-lg bg-[#243428] border border-[#B8A06A] text-white outline-none">



<button 
id="loginBtn"
class="w-full bg-[#556B2F] hover:bg-[#6B8E23] py-3 rounded-lg text-white">

Login

</button>


<p id="message" class="text-center mt-4 text-red-400"></p>


</div>


<script src="login.js"></script>


</body>

</html>
